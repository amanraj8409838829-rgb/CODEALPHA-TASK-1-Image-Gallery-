<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Gallery | CodeAlpha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <h1>Image Gallery</h1>
  <p>A curated collection of photography. Filter by category, then click any image to view it full size.</p>
  <nav class="filters" aria-label="Filter images">
    <button class="active" data-filter="all">All</button>
    <button data-filter="nature">Nature</button>
    <button data-filter="animals">Animals</button>
    <button data-filter="places">Places</button>
  </nav>
</header>

<main id="gallery" class="grid"></main>

<div id="lightbox" class="lightbox" hidden>
  <button class="lb-btn close" aria-label="Close">&times;</button>
  <button class="lb-btn prev" aria-label="Previous image">&#10094;</button>
  <figure>
    <img id="lb-img" alt="">
    <figcaption id="lb-cap"></figcaption>
  </figure>
  <button class="lb-btn next" aria-label="Next image">&#10095;</button>
</div>
<footer>Built with HTML, CSS &amp; JavaScript &middot; CodeAlpha Internship</footer>
<script src="script.js"></script>
</body>
</html>
